name: SERP Reports (every 30 min, gated by Europe/Malta)

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch: {}       # allow manual runs

permissions:
  contents: read

jobs:
  serp:
    runs-on: ubuntu-latest
    env:
      DATAFORSEO_USER: ${{ secrets.DATAFORSEO_USER }}
      DATAFORSEO_PASS: ${{ secrets.DATAFORSEO_PASS }}
      REPORTS_ROOT_ID: ${{ secrets.REPORTS_ROOT_ID }}
      SCREENSHOTS_ROOT_ID: ${{ secrets.SCREENSHOTS_ROOT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON_PATH: ${{ github.workspace }}/service_account.json
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Preferimos base64 para evitar problemas de formato del JSON
      - name: Write service_account.json from base64 secret
        env:
          SA_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          echo "$SA_JSON_B64" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS_JSON_PATH"
          python -c 'import json,os,sys; p=os.environ["GOOGLE_APPLICATION_CREDENTIALS_JSON_PATH"]; json.load(open(p,"r",encoding="utf-8")); print("Service account JSON validated OK")'

      - name: Run SERP script (Malta time-gated)
        run: |
          python SERP_Multi_Engine.py
